<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="100%" height="100%">
  <defs>
    <!-- ================= GRADIENTES DEL ISOTIPO ================= -->
    <linearGradient id="iso-tech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="iso-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="iso-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- ================= GRADIENTES DE LAS LETRAS (CO - IN - SI) ================= -->
    <!-- 1. Tono para "CO" (Azul Eléctrico / Real) -->
    <linearGradient id="grad-CO" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 2. Tono para "IN" (Cian Luminoso / Celeste Tecnológico) -->
    <linearGradient id="grad-IN" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 3. Tono para "SI" (Turquesa / Verde Azulado Digital) -->
    <linearGradient id="grad-SI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- ==================== ISOTIPO: NÚCLEO DE SISTEMAS Y REDES ==================== -->
  <g id="isotipo-sistemas">
    <!-- Hexágono tecnológico seccionado -->
    <path d="M 85 22 L 135 51 L 135 92" fill="none" stroke="url(#iso-tech)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 85 138 L 35 109 L 35 68" fill="none" stroke="url(#iso-accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Puentes de datos / Ruteo de algoritmos internos -->
    <path d="M 55 58 L 85 41 L 115 58 L 115 80 L 85 98 L 55 80 Z" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Ejes de interconexión digital -->
    <line x1="85" y1="22" x2="85" y2="56" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" />
    <line x1="85" y1="104" x2="85" y2="138" stroke="#0284C7" stroke-width="4" stroke-linecap="round" />
    <line x1="35" y1="68" x2="64" y2="73" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" />
    <line x1="135" y1="92" x2="106" y2="87" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" />

    <!-- Nodo Central -->
    <polygon points="85,60 102,70 102,90 85,100 68,90 68,70" fill="url(#iso-core)" />
    <circle cx="85" cy="80" r="6" fill="#22D3EE" />

    <!-- Nodos Periféricos -->
    <circle cx="85" cy="22" r="6.5" fill="#38BDF8" />
    <circle cx="135" cy="51" r="5.5" fill="#0284C7" />
    <circle cx="135" cy="92" r="6.5" fill="#0EA5E9" />
    <circle cx="85" cy="138" r="6.5" fill="#0D9488" />
    <circle cx="35" cy="109" r="5.5" fill="#14B8A6" />
    <circle cx="35" cy="68" r="6.5" fill="#22D3EE" />

    <!-- Píxeles de flujo de información -->
    <rect x="122" y="23" width="7" height="7" rx="1.5" fill="#22D3EE" />
    <rect x="134" y="31" width="5" height="5" rx="1" fill="#38BDF8" />
    <rect x="40" y="123" width="7" height="7" rx="1.5" fill="#0EA5E9" />
  </g>

  <!-- ==================== LOGOTIPO: CO - IN - SI ==================== -->
  <!-- Altura uniforme de 84px (Y: 38 a Y: 122) y grosor de trazo de 18px -->
  <g id="logotipo-coinsi">
    
    <!-- BLOQUE 1: "CO" (Azul Eléctrico Profundo) -->
    <g id="silaba-CO" fill="url(#grad-CO)">
      <!-- LETRA C -->
      <path d="M 237 59 A 34 34 0 0 0 209 38 A 34 34 0 0 0 175 72 L 175 88 A 34 34 0 0 0 209 122 A 34 34 0 0 0 237 101 L 222 91 A 16 16 0 0 1 209 104 A 16 16 0 0 1 193 88 L 193 72 A 16 16 0 0 1 209 56 A 16 16 0 0 1 222 69 Z" />

      <!-- LETRA O -->
      <path d="M 289 38 A 34 34 0 0 1 323 72 L 323 88 A 34 34 0 0 1 289 122 A 34 34 0 0 1 255 88 L 255 72 A 34 34 0 0 1 289 38 Z M 289 56 A 16 16 0 0 0 273 72 L 273 88 A 16 16 0 0 0 289 104 A 16 16 0 0 0 305 88 L 305 72 A 16 16 0 0 0 289 56 Z" fill-rule="evenodd" />
    </g>
    <!-- Nodo central de la O en cian para conectar con el siguiente bloque -->
    <circle cx="289" cy="80" r="5.5" fill="#38BDF8" />

    <!-- BLOQUE 2: "IN" (Cian Luminoso) -->
    <g id="silaba-IN" fill="url(#grad-IN)">
      <!-- PRIMERA LETRA I (Mayúscula sólida) -->
      <rect x="345" y="38" width="18" height="84" rx="3" />

      <!-- LETRA N -->
      <path d="M 387 122 L 387 38 L 405 38 L 435 90 L 435 38 L 453 38 L 453 122 L 435 122 L 405 70 L 405 122 Z" />
    </g>

    <!-- BLOQUE 3: "SI" (Turquesa Tecnológico) -->
    <g id="silaba-SI" fill="url(#grad-SI)">
      <!-- LETRA S -->
      <path d="M 538 56 C 531 44 520 38 506 38 C 487 38 475 49 475 63 C 475 78 487 84 505 88 C 518 91 523 94 523 100 C 523 106 516 109 507 109 C 497 109 489 104 484 96 L 470 107 C 478 117 491 122 507 122 C 527 122 541 112 541 97 C 541 81 528 75 510 71 C 497 68 493 65 493 60 C 493 54 499 51 507 51 C 515 51 521 55 525 63 Z" />

      <!-- SEGUNDA LETRA I (Mayúscula sólida completa, igual a la primera I) -->
      <rect x="563" y="38" width="18" height="84" rx="3" />
    </g>

  </g>
</svg>